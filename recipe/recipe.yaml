schema_version: 1

context:
  version: 1.8.0

package:
  name: langchain-openai
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/l/langchain-openai/langchain_openai-${{ version }}.tar.gz
  sha256: 670a39def25c550ac7b828f6c4336f5653a440e992584590f6cc168525d993b7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - certifi >=2024.6.2
    - python >=${{ python_min }}
    - langchain-core >=1.8.0,<2.0.0
    - openai >=2.45.0
    - tiktoken >=0.7.0
tests:
  - python:
      imports:
        - langchain_openai
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: LangChain integrations for OpenAI through their openai SDK
  homepage: https://github.com/langchain-ai/langchain/tree/master/libs/partners/openai

extra:
  recipe-maintainers:
    - jan-janssen
    - pavelzw
    - raybellwaves
